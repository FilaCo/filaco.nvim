# Check Lua Formatting
name: Check Lua Formatting
on:
  pull_request:
  push:
    branches: [master]

jobs:
  stylua-check:
    name: Stylua Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Stylua Check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The version Mason installs locally, so CI and format-on-save agree
          version: 2.5.2
          args: --check .
